name: Integration test

on:
  pull_request:
  push:
    branches:
      - master
      - stable*

permissions:
  contents: read

concurrency:
  group: integration-test-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true


jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    outputs:
      src: ${{ steps.changes.outputs.src}}

    steps:
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: changes
        continue-on-error: true
        with:
          filters: |
            src:
              - 'main.py'
              - 'main_em.py'
              - 'config.cpu.yaml'
              - 'config.gpu.yaml'
              - 'context_chat_backend/**'
              - 'appinfo/**'
              - 'example.env'
              - 'hwdetect.sh'
              - 'persistent_storage/**'
              - 'project.toml'
              - 'requirements.txt'
              - 'logger_config.yaml'
              - 'logger_config_em.yaml'
              - 'supervisord.conf'
              - '.github/workflows/integration-test.yml'
              - 'Dockerfile'
              - 'dockerfile_scripts/**'

  integration:
    runs-on: ubuntu-24.04

    needs: changes
    if: needs.changes.outputs.src != 'false'

    strategy:
      # do not stop on another job's failure
      fail-fast: false
      matrix:
        php-versions: [ '8.2' ]
        databases: [ 'pgsql' ]
        server-versions: [ 'stable32', 'stable33', 'stable34' ]
        include:
        - php-versions: '8.3'
          databases: 'pgsql'
          server-versions: 'master'

    name: Integration test on ${{ matrix.server-versions }} php@${{ matrix.php-versions }}

    env:
      MYSQL_PORT: 4444
      PGSQL_PORT: 4445
      # use the same db for ccb and nextcloud
      CCB_DB_URL: postgresql+psycopg://root:rootpassword@localhost:4445/nextcloud

    services:
      mysql:
        image: mariadb:10.5
        ports:
          - 4444:3306/tcp
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
        options: --health-cmd="mysqladmin ping" --health-interval 5s --health-timeout 2s --health-retries 5
      postgres:
        image: pgvector/pgvector:pg17
        ports:
          - 4445:5432/tcp
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: rootpassword
          POSTGRES_DB: nextcloud
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 2s --health-retries 5 --name postgres --hostname postgres

    steps:
      - name: Enable PostgreSQL slow query logging and auto_explain
        run: |
          docker exec postgres bash -c "\
            cat >> /var/lib/postgresql/data/postgresql.conf <<EOF

          # slow query logging
          log_min_duration_statement = 20

          # auto_explain for slow queries
          session_preload_libraries = 'auto_explain'
          auto_explain.log_min_duration = '20ms'
          auto_explain.log_analyze = on
          auto_explain.log_buffers = on
          auto_explain.log_nested_statements = on
          auto_explain.log_verbose = on

          # file-based logging
          logging_collector = on
          log_directory = '/var/log/pg_log'
          log_filename = 'postgresql.log'
          log_file_mode = 0644
          EOF"

          # create the log directory and set ownership for postgres user (logging_collector needs it)
          docker exec postgres bash -c "mkdir -p /var/log/pg_log && chown -R postgres:postgres /var/log/pg_log"

          # logging_collector requires a restart to take effect
          docker restart postgres
          # wait for postgres to be ready again (max 60 seconds)
          timeout 60 bash -c 'until docker exec postgres pg_isready -U root; do sleep 1; done' || { echo "Error: PostgreSQL did not become ready within 60 seconds"; docker logs postgres --tail 50; exit 1; }

          # verify the config has been loaded
          docker exec postgres psql -U root -d nextcloud -c "SHOW log_min_duration_statement;"
          docker exec postgres psql -U root -d nextcloud -c "SHOW session_preload_libraries;"

      - name: Checkout server
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          repository: nextcloud/server
          ref: ${{ matrix.server-versions }}
          submodules: 'recursive'
          persist-credentials: false

      - name: Set up php ${{ matrix.php-versions }}
        uses: shivammathur/setup-php@9e72090525849c5e82e596468b86eb55e9cc5401 # v2
        with:
          php-version: ${{ matrix.php-versions }}
          tools: phpunit
          extensions: mbstring, iconv, fileinfo, intl, sqlite, pdo_mysql, pdo_sqlite, pgsql, pdo_pgsql, gd, zip

      - name: Checkout context_chat php app
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          repository: nextcloud/context_chat
          path: apps/context_chat
          persist-credentials: false

      - name: Checkout backend
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          path: context_chat_backend/
          persist-credentials: false

      - name: Checkout app_api
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          repository: nextcloud/app_api
          ref: ${{ matrix.server-versions == 'master' && 'main' || matrix.server-versions }}
          path: apps/app_api
          persist-credentials: false

      - name: Get app version
        id: appinfo
        uses: skjnldsv/xpath-action@7e6a7c379d0e9abc8acaef43df403ab4fc4f770c # master
        with:
          filename: context_chat_backend/appinfo/info.xml
          expression: "/info/version/text()"

      - name: Set up Nextcloud MYSQL
        if: ${{ matrix.databases != 'pgsql'}}
        run: |
          sleep 25
          mkdir data
          ./occ maintenance:install --verbose --database=${{ matrix.databases }} --database-name=nextcloud --database-host=127.0.0.1 --database-port=$MYSQL_PORT --database-user=root --database-pass=rootpassword --admin-user admin --admin-pass password
          composer run serve &

      - name: Set up Nextcloud PGSQL
        if: ${{ matrix.databases == 'pgsql'}}
        run: |
          sleep 25
          mkdir data
          ./occ maintenance:install --verbose --database=${{ matrix.databases }} --database-name=nextcloud --database-host=127.0.0.1 --database-port=$PGSQL_PORT --database-user=root --database-pass=rootpassword --admin-user admin --admin-pass password
          composer run serve &

      - name: Enable context_chat, app_api and testing
        run: ./occ app:enable -vvv -f context_chat app_api testing

      - name: Checkout documentation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          repository: nextcloud/documentation
          path: data/admin/files/documentation
          persist-credentials: false

      - name: Prepare docs
        run: |
          cd data/admin/files
          mv documentation/admin_manual .
          cp -R documentation/developer_manual .
          cd developer_manual
          find . -type f -name "*.rst" -exec bash -c 'mv "$0" "${0%.rst}.md"' {} \;
          cd ..
          cp -R documentation/developer_manual ./developer_manual2
          cd developer_manual2
          find . -type f -name "*.rst" -exec bash -c 'mv "$0" "${0%.rst}.txt"' {} \;
          cd ..
          rm -rf documentation

      - name: Run files scan
        run: |
          ./occ files:scan --all

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3

      - name: Build the context_chat_backend cpu image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6
        with:
          context: context_chat_backend
          push: false
          platforms: linux/amd64
          # use local tag so image is not pulled from remote
          tags: ghcr.io/ccb-cpu:local
          target: runtime-cpu
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start backend container
        run: |
          cd context_chat_backend
          echo "NEXTCLOUD_URL=http://localhost:8080" >> example.env
          cd ..
          # create it up front so the bind mount is not root-owned-only and the log
          # files stay readable from the runner after the job
          mkdir -p context_chat_backend/persistent_storage/logs
          chmod -R 777 context_chat_backend/persistent_storage
          docker run --net host --name context_chat_backend \
            --env-file context_chat_backend/example.env \
            -v $(pwd)/context_chat_backend/persistent_storage:/app/persistent_storage \
            -e APP_PERSISTENT_STORAGE=/app/persistent_storage \
            -e EXTERNAL_DB="$CCB_DB_URL" \
            -d ghcr.io/ccb-cpu:local

      - name: Register backend
        run: |
          timeout 10 ./occ app_api:daemon:register --net host manual_install "Manual Install" manual-install http localhost http://localhost:8080
          timeout 180 ./occ app_api:app:register context_chat_backend manual_install --json-info "{\"appid\":\"context_chat_backend\",\"name\":\"Context Chat Backend\",\"daemon_config_name\":\"manual_install\",\"version\":\"${{ fromJson(steps.appinfo.outputs.result).version }}\",\"secret\":\"12345\",\"port\":10034,\"scopes\":[],\"system_app\":0}" --force-scopes --wait-finish
          ls -la context_chat_backend/persistent_storage/*

      - name: Initial memory usage check
        run: |
          docker stats --no-stream context_chat_backend
          docker stats --no-stream --format '{{.MemPerc}}' context_chat_backend | tr -d ' %' > initial_mem.txt

      - name: Run cron jobs
        run: |
          # every 10 seconds indefinitely
          while true; do
            php cron.php
            sleep 10
          done &
          sleep 30
          # list all the bg jobs
          ./occ background-job:list

      - name: Initial dump of DB with context_chat_queue populated
        if: always()
        run: |
          docker exec postgres pg_dump nextcloud > /tmp/0_pgdump_nextcloud

      - name: Periodically check context_chat stats for 15 minutes to allow the backend to index the files
        run: |
          success=0
          echo "::group::Checking stats periodically for 15 minutes to allow the backend to index the files"
          for i in {1..90}; do
            echo "Checking stats, attempt $i..."

            stats_err=$(mktemp)
            stats_exit=0
            stats=$(timeout 30 ./occ context_chat:stats --json 2>"$stats_err") || stats_exit=$?
            echo "Stats output:"
            echo "$stats"
            if [ -s "$stats_err" ]; then
              echo "Stderr:"
              cat "$stats_err"
            fi
            echo "---"
            rm -f "$stats_err"

            # Check for critical errors in output
            if [ $stats_exit -ne 0 ] || echo "$stats" | grep -q "Error during request"; then
              echo "Backend connection error detected (exit=$stats_exit), retrying..."
              sleep 10
              continue
            fi

            # Extract total eligible files
            total_eligible_files=$(echo "$stats" | jq '.eligible_files_count' || echo "")

            # Extract indexed documents count (files__default)
            indexed_count=$(echo "$stats" | jq '.vectordb_document_counts.files__default' || echo "")

            echo "Total eligible files: $total_eligible_files"
            echo "Indexed documents (files__default): $indexed_count"

            diff=$((total_eligible_files - indexed_count))
            threshold=$((total_eligible_files * 3 / 100))

            # Check if difference is within tolerance
            if [ $diff -le $threshold ]; then
              echo "Indexing within 3% tolerance (diff=$diff, threshold=$threshold)"
              success=1
              break
            else
              progress=$((diff * 100 / total_eligible_files))
              echo "Outside 3% tolerance: diff=$diff (${progress}%), threshold=$threshold"
            fi

            # Check if backend is still alive; inspect prints exactly "true"/"false"
            # and nothing at all when the container is gone
            ccb_alive=$(docker inspect -f '{{.State.Running}}' context_chat_backend 2>/dev/null || true)
            if [ "$ccb_alive" != "true" ]; then
              echo "Error: Context Chat Backend container is not running. Exiting."
              docker logs --tail 50 context_chat_backend 2>&1 || true
              exit 1
            fi

            sleep 10
          done

          echo "::endgroup::"

          if [ $success -ne 1 ]; then
            echo "Max attempts reached"
            exit 1
          fi

      - name: Run the prompts
        run: |
          ./occ background-job:worker 'OC\TaskProcessing\SynchronousBackgroundJob' > worker1_logs 2>&1 &
          ./occ background-job:worker 'OC\TaskProcessing\SynchronousBackgroundJob' > worker2_logs 2>&1 &

          echo ::group::English prompt
          OUT1=$(./occ context_chat:prompt admin "Which factors are taken into account for the Ethical AI Rating?")
          echo "$OUT1"
          echo "$OUT1" | grep -q "If all of these points are met, we give a Green label." || exit 1
          echo ::endgroup::

          echo ::group::German prompt
          OUT2=$(./occ context_chat:prompt admin "Welche Faktoren beeinflussen das Ethical AI Rating?")
          echo "$OUT2"
          echo "$OUT2" | grep -q "If all of these points are met, we give a Green label." || exit 1
          echo ::endgroup::

      - name: Wait for files queue to drain to zero
        run: |
          echo "::group::Waiting up to 5 minutes for documents queue to reach zero"
          for i in {1..30}; do
            stats=$(./occ context_chat:stats --json)
            scheduled=$(echo "$stats" | jq '[.queued_documents_counts | to_entries[].value] | add // 0')
            echo "Attempt $i: queued_documents=$scheduled"
            if [ "$scheduled" = "0" ]; then
              echo "Queue is empty"
              break
            fi
            if [ "$i" = "30" ]; then
              echo "Timeout: queue did not drain to zero (queued_documents=$scheduled)"
              exit 1
            fi
            sleep 10
          done
          echo "::endgroup::"

      - name: Check if the empty files get identified, not indexed and don't cause any issues with the batch
        run: |
          NEW_FILES_COUNT=5

          # StatisticsService caches eligible_files_count in appconfig for an hour, because
          # StorageService#countFiles() walks every mount. Both stats calls in this step would
          # otherwise return the same stale number from before the scan, while the (uncached)
          # vectordb counts do advance. Drop the cache so countFiles() runs again.
          invalidate_eligible_files_cache() {
            ./occ config:app:delete context_chat eligible_files_count
            ./occ config:app:delete context_chat eligible_files_count_time
          }

          echo "::group::Stats before the empty files are added"
          invalidate_eligible_files_cache
          prev_stats=$(./occ context_chat:stats --json)
          echo "$prev_stats"
          prev_scheduled=$(echo "$prev_stats" | jq '.queued_documents_counts.files__default // 0')
          prev_eligible=$(echo "$prev_stats" | jq '.eligible_files_count')
          prev_indexed=$(echo "$prev_stats"  | jq '.vectordb_document_counts.files__default // 0')
          echo "queued_documents_counts.files__default before scan: $prev_scheduled"
          echo "::endgroup::"

          # create empty markdown files in admin's home folder
          for i in $(seq 1 $NEW_FILES_COUNT); do
            touch "data/admin/files/test_empty_$i.md"
          done

          # create one new file with content
          echo "hello world" > "data/admin/files/test_filled.md"

          # run files scan so Nextcloud registers the new files
          ./occ files:scan admin

          echo "::group::Confirming new files appear in the queue after scan"
          stats=$(./occ context_chat:stats --json)
          echo "$stats"
          scheduled=$(echo "$stats" | jq '.queued_documents_counts.files__default // 0')
          echo "queued_documents_counts.files__default after scan: $scheduled"
          expected_scheduled=$((prev_scheduled + NEW_FILES_COUNT + 1))  # +1 non-empty file
          if [ "$scheduled" -ne "$expected_scheduled" ]; then
            echo "Error: expected exactly $expected_scheduled files in the queue (prev=$prev_scheduled + new=$NEW_FILES_COUNT), got $scheduled"
            exit 1
          fi
          echo "::endgroup::"

          echo "::group::Waiting up to 5 minutes for queue to drain to zero again"
          for i in {1..30}; do
            stats=$(./occ context_chat:stats --json)
            scheduled=$(echo "$stats" | jq '[.queued_documents_counts | to_entries[].value] | add // 0')
            locked=$(echo "$stats"    | jq '[.queued_documents_locked_counts | to_entries[].value] | add // 0')
            echo "Attempt $i: queued_documents=$scheduled locked=$locked"
            if [ "$scheduled" = "0" ] && [ "$locked" = "0" ]; then
              echo "Queue drained"
              break
            fi
            if [ "$i" = "30" ]; then
              echo "Timeout: queue did not drain to zero (queued_documents=$scheduled locked=$locked)"
              exit 1
            fi
            sleep 10
          done
          echo "::endgroup::"

          # locked must be zero
          if [ "$locked" != "0" ]; then
            echo "Error: expected locked count to be 0, got $locked"
            exit 1
          fi
          echo "Locked count is 0 as expected"

          # StorageService#countFiles filters size > 0, so empty files are NOT counted as eligible.
          # Only the 1 non-empty file is both eligible and indexed, so the gap must stay the same (diff=0).
          invalidate_eligible_files_cache
          stats=$(./occ context_chat:stats --json)
          eligible=$(echo "$stats" | jq '.eligible_files_count')
          indexed=$(echo "$stats"  | jq '.vectordb_document_counts.files__default // 0')
          echo "prev: eligible=$prev_eligible  indexed=$prev_indexed"
          echo "eligible_files_count=$eligible  vectordb_document_counts.files__default=$indexed"

          prev_gap=$((prev_eligible - prev_indexed))
          curr_gap=$((eligible - indexed))
          gap_diff=$((curr_gap - prev_gap))
          echo "gap before=$prev_gap  gap after=$curr_gap  difference=$gap_diff  expected=0"
          if [ "$gap_diff" -ne "0" ]; then
            echo "Error: expected the eligible-indexed gap to stay the same (empty files are excluded from eligible_files_count by the size > 0 filter), got diff=$gap_diff"
            exit 1
          fi
          echo "PASS: empty files excluded from eligible_files_count (size > 0 filter) and absent from vectordb_document_counts"

      - name: Wipe and reindex only the files provider
        run: |
          ./occ context_chat:wipe --force --provider files__default --reindex

          stats=$(./occ context_chat:stats --json)
          echo "$stats"
          indexed=$(echo "$stats" | jq '.vectordb_document_counts.files__default // 0')
          if [ "$indexed" != "0" ]; then
            echo "Error: expected no indexed files right after the files wipe, got $indexed"
            exit 1
          fi

          echo "::group::Waiting up to 10 minutes for the files to be indexed again"
          for i in {1..60}; do
            stats=$(timeout 30 ./occ context_chat:stats --json || true)
            indexed=$(echo "$stats" | jq '.vectordb_document_counts.files__default // 0' 2>/dev/null || echo 0)
            echo "Attempt $i: indexed=$indexed"
            if [ "$indexed" -ge 10 ]; then
              echo "::endgroup::"
              echo "Files reindexed, $indexed documents"
              exit 0
            fi
            sleep 10
          done
          echo "::endgroup::"
          echo "Error: files were not indexed again after the files wipe"
          exit 1

      - name: Wipe all the indexed data and check that the queues and the vector DB are empty
        run: |
          ./occ context_chat:wipe --force

          stats=$(./occ context_chat:stats --json)
          echo "$stats"
          indexed=$(echo "$stats" | jq '[.vectordb_document_counts | to_entries[].value] | add // 0')
          queued=$(echo "$stats" | jq '[.queued_documents_counts | to_entries[].value] | add // 0')
          actions=$(echo "$stats" | jq '.queued_actions_count')
          fs_events=$(echo "$stats" | jq '.queued_fs_events_count')
          # the queued counts leave out locked items, check those separately
          queued_locked=$(echo "$stats" | jq '[.queued_documents_locked_counts | to_entries[].value] | add // 0')
          actions_locked=$(echo "$stats" | jq '.queued_actions_locked_count')
          backend_available=$(echo "$stats" | jq '.backend_available')
          echo "indexed=$indexed queued=$queued queued_locked=$queued_locked actions=$actions actions_locked=$actions_locked fs_events=$fs_events backend_available=$backend_available"
          if [ "$backend_available" != "true" ] || [ "$indexed" != "0" ] || [ "$queued" != "0" ] || [ "$queued_locked" != "0" ] || [ "$actions" != "0" ] || [ "$actions_locked" != "0" ] || [ "$fs_events" != "0" ]; then
            echo "Error: expected an empty vector DB and empty queues after the wipe"
            exit 1
          fi

      - name: Reindex and check that documents get indexed again
        run: |
          ./occ context_chat:reindex
          echo "::group::Waiting up to 10 minutes for documents to be indexed again"
          for i in {1..60}; do
            stats=$(timeout 30 ./occ context_chat:stats --json || true)
            indexed=$(echo "$stats" | jq '.vectordb_document_counts.files__default // 0' 2>/dev/null || echo 0)
            echo "Attempt $i: indexed=$indexed"
            if [ "$indexed" -ge 10 ]; then
              echo "Reindex works, $indexed documents indexed again"
              echo "::endgroup::"
              exit 0
            fi
            sleep 10
          done
          echo "::endgroup::"
          echo "Error: documents were not indexed again after the reindex"
          exit 1

      - name: Check python memory usage
        run: |
          docker stats --no-stream context_chat_backend
          docker stats --no-stream --format '{{.MemPerc}}' context_chat_backend | tr -d ' %' > after_prompt_mem.txt

      - name: Compare memory usage and detect leak
        run: |
          initial_mem=$(cat initial_mem.txt | tr -d ' ')
          final_mem=$(cat after_prompt_mem.txt | tr -d ' ')
          echo "Initial Memory Usage: $initial_mem%"
          echo "Memory Usage after prompt: $final_mem%"

          if (( $(echo "$final_mem > $initial_mem" | bc -l) )); then
            echo "Memory usage has increased during the run. Possible memory leak detected!"
          else
            echo "Memory usage during the run is stable. No memory leak detected."
          fi

      - name: Final dump of DB with vectordb populated
        if: always()
        run: |
          docker exec postgres pg_dump nextcloud > /tmp/1_pgdump_nextcloud

      - name: Show server logs
        if: always()
        run: |
          cat data/nextcloud.log

      - name: Show context_chat specific logs
        if: always()
        run: |
          cat data/context_chat.log

      - name: Show task processing worker logs
        if: always()
        run: |
          tail -v -n +1 worker?_logs || echo "No worker logs"

      - name: Show container logs
        if: always()
        run: |
          # supervisord routes both the main app and the embedding server to the
          # container's stdout/stderr, so this covers each of them
          docker logs context_chat_backend || echo "No container logs"

      - name: Show main app JSON logs
        if: always()
        run: |
          sudo tail -v -n +1 context_chat_backend/persistent_storage/logs/ccb.log* || echo "No logs in logs directory"

      - name: Show embedding server JSON logs
        if: always()
        run: |
          sudo tail -v -n +1 context_chat_backend/persistent_storage/logs/em_server.log* || echo "No logs in logs directory"

      - name: Upload database dumps
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: database-dumps-${{ matrix.server-versions }}-php@${{ matrix.php-versions }}
          path: |
            /tmp/0_pgdump_nextcloud
            /tmp/1_pgdump_nextcloud

      - name: Show PostgreSQL slow query logs
        if: always()
        run: |
          docker exec postgres cat /var/log/pg_log/postgresql.log

      - name: Final stats log
        if: always()
        run: |
          ./occ context_chat:stats
          ./occ context_chat:stats --json

  summary:
    permissions:
      contents: none
    runs-on: ubuntu-latest-low
    needs: [changes, integration]

    if: always()

    # This is the summary, we just avoid to rename it so that branch protection rules still match
    name: integration-test

    steps:
      - name: Summary status
        run: if ${{ needs.changes.outputs.src != 'false' && needs.integration.result != 'success' }}; then exit 1; fi
